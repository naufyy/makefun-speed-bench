name: bench

# Runs the speed bench on a fast, quiet GitHub-hosted CPU and commits the
# generated Markdown report back under results/. No secrets, no external
# services — only the built-in GITHUB_TOKEN.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'results/**' # the results commit must not retrigger the bench

permissions:
  contents: write

concurrency:
  group: bench
  cancel-in-progress: false

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22' # entries are TypeScript run directly by Node (>= 22.18 type stripping)

      - name: Run bench
        run: node bench.mjs --rounds 15

      - name: Commit results back
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/
          if git diff --cached --quiet; then
            echo "no new results to commit"
            exit 0
          fi
          git commit -m "bench results: run ${{ github.run_number }} ($(date -u +%Y-%m-%d)) [skip ci]"
          git push
